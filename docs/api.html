<h1>Health Endpoint</h1>

<p>The documentation site exposes a simple health endpoint.</p>

<pre>
GET /health
</pre>

Example:

<pre>
curl https://scanstock-docs.jcp-vision.com/health
</pre>

Response:

<pre>
{
 "status": "ok",
 "service": "scanstock-docs"
}
</pre>
